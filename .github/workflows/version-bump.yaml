---
name: Version bump

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  vbump:
    name: Bump development version
    if: >-
      !contains(github.event.head_commit.message, '[skip vbump]') &&
      !contains(github.event.head_commit.message, '[automated vbump]')
    runs-on: ubuntu-latest
    container:
      image: docker.io/rocker/tidyverse:latest
    steps:
      - name: Create app token
        id: app-token
        # v2.2.2
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout main
        uses: actions/checkout@v4.1.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Bump and push development version
        env:
          PUSH_SHA: ${{ github.sha }}
        run: bash .github/scripts/version-bump.sh
